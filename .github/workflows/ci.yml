name: ci

on:
  push:
  pull_request:

jobs:
  # Contributions are almost always a single JSON file, so this job is the one
  # that matters and it runs in seconds without a toolchain.
  results:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/validate.py
      - name: Render the table
        run: python3 tools/table.py

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cargo build --release --locked
      - run: cargo test --locked
      - run: cargo clippy --release --all-targets -- -D warnings
      - run: cargo fmt --check
      # A GitHub runner is a shared VM that exposes no cpufreq governor, so the
      # guard must refuse here. Asserted rather than merely printed: v0.1.0
      # shipped with this combination as a warning, which meant CI could write
      # a committable result file. If this step ever starts passing, the
      # refusal has regressed.
      - name: The guard must refuse on a shared runner
        run: |
          set +e
          ./target/release/napkin --stdout > /tmp/ci.json 2> /tmp/ci.err
          status=$?
          cat /tmp/ci.err
          if [ "$status" -eq 0 ]; then
            echo "FAIL: napkin produced a result on a virtualized CI runner"
            exit 1
          fi
          grep -q "no cpufreq governor exposed" /tmp/ci.err || {
            echo "FAIL: refused, but not for the expected reason"; exit 1; }
          echo "OK: refused with status $status"
